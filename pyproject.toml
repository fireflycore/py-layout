[project]
name = "firefly-py-layout"
version = "0.0.1"
description = "Firefly Python service layout template and integration sample."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "lhdht" },
]
dependencies = [
  "alembic>=1.13.0",
  "asyncmy>=0.2.9",
  "asyncpg>=0.29.0",
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "firefly-consul==0.0.1",
  "firefly-micro==0.0.1",
  "grpcio>=1.65.0",
  "grpcio-tools>=1.65.0",
  "httpx>=0.27.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-grpc>=0.48b0",
  "opentelemetry-instrumentation-logging>=0.48b0",
  "opentelemetry-instrumentation-redis>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-sdk>=1.27.0",
  "prometheus-client>=0.20.0",
  "protobuf>=5.27.0",
  "protovalidate>=0.4.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.0",
  "structlog>=24.0.0",
  "uvicorn[standard]>=0.30.0",
  "zstandard>=0.23.0",
]

[dependency-groups]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
firefly-micro = { path = "../py-micro", editable = true }
firefly-consul = { path = "../py-consul", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]
explicit_package_bases = true
ignore_missing_imports = true
